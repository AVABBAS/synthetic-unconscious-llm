<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="112" viewBox="0 0 1200 112" role="img" aria-label="Study in numbers: 36 sessions, 3 models, 2 arms, 2 coding passes, 5 codebooks">
  <rect width="1200" height="112" fill="#16324f"/>
  <rect x="0" y="0" width="1200" height="4" fill="#c9a227"/>
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="120" y="58" font-size="40" font-weight="bold" fill="#ffffff">36</text>
    <text x="120" y="88" font-size="14" letter-spacing="2" fill="#cfdde9">SESSIONS</text>
    <line x1="240" y1="24" x2="240" y2="88" stroke="#ffffff" stroke-opacity="0.22"/>
    <text x="360" y="58" font-size="40" font-weight="bold" fill="#ffffff">3</text>
    <text x="360" y="88" font-size="14" letter-spacing="2" fill="#cfdde9">FRONTIER MODELS</text>
    <line x1="480" y1="24" x2="480" y2="88" stroke="#ffffff" stroke-opacity="0.22"/>
    <text x="600" y="58" font-size="40" font-weight="bold" fill="#ffffff">2</text>
    <text x="600" y="88" font-size="14" letter-spacing="2" fill="#cfdde9">INTERVIEW ARMS</text>
    <line x1="720" y1="24" x2="720" y2="88" stroke="#ffffff" stroke-opacity="0.22"/>
    <text x="840" y="58" font-size="40" font-weight="bold" fill="#ffffff">2</text>
    <text x="840" y="88" font-size="14" letter-spacing="2" fill="#cfdde9">CODING PASSES</text>
    <line x1="960" y1="24" x2="960" y2="88" stroke="#ffffff" stroke-opacity="0.22"/>
    <text x="1080" y="58" font-size="40" font-weight="bold" fill="#ffffff">5</text>
    <text x="1080" y="88" font-size="14" letter-spacing="2" fill="#cfdde9">CODEBOOKS</text>
  </g>
</svg>
